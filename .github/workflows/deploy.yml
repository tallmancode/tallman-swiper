name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (vX.Y.Z)"
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW_TAG="${INPUT_TAG}"
          else
            RAW_TAG="${PUSH_REF}"
          fi
          if ! echo "${RAW_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing deploy: tag '${RAW_TAG}' is not vX.Y.Z"
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set image metadata
        id: meta
        env:
          RAW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=${RAW_TAG}"
            echo "owner=${OWNER}"
            echo "image=ghcr.io/${OWNER}/tallman-swiper"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENV=production
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=tallman-swiper
          cache-to: type=gha,mode=max,scope=tallman-swiper

      - name: Deploy over SSH
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_OWNER,COMPOSE_DIR
          script: |
            set -euo pipefail
            cd "${COMPOSE_DIR}"
            DEPLOY_IMAGE_TAG="${IMAGE_TAG}"
            DEPLOY_GHCR_OWNER="${GHCR_OWNER}"
            if [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi
            export IMAGE_TAG="${DEPLOY_IMAGE_TAG}"
            export GHCR_OWNER="${DEPLOY_GHCR_OWNER}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GHCR_OWNER: ${{ steps.meta.outputs.owner }}
          COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
